name: Update show feed

on:
  schedule:
    - cron: '17 11 * * *'   # daily ~6:17am Central
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: write
  issues: write               # to open an issue if the build fails

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build shows.json
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
        run: node feed/build-shows.js 2>&1 | tee build.log

      - name: Verify the build
        # includes validating every show page's structured data, so malformed
        # markup fails here instead of quietly dropping out of Google
        run: node --test

      - name: Commit refreshed feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          # data, calendar file, offline fallback, the per-show and per-day
          # pages, sitemap + robots, the learned venue addresses, and the
          # preview cache (so each run only looks up artists it hasn't seen).
          # "git add <dir>" stages removals too, which is how expired pages go.
          git add shows.json confluence.ics index.html show day sitemap.xml robots.txt \
                  feed/venues.json feed/preview-cache.json
          git diff --staged --quiet || git commit -m "chore: refresh show feed ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push

      - name: Open an issue if the build failed
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -40 build.log > failure.txt 2>/dev/null || true
          node promo/notify.js "Daily show feed" failure.txt
